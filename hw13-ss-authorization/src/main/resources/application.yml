spring:
  mvc:
    log-request-details: true
    hiddenmethod:
      filter:
        enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5428/demoDB
    driver-class-name: org.postgresql.Driver
    username: usr
    password: pwd

#  datasource:
#    url: jdbc:h2:mem:maindb
#    driver-class-name: org.h2.Driver
#    username: sa
#    password:
#  h2:
#    console:
#      enabled: true
#      path: /h2-console
#      settings:
#        web-allow-others: false
  flyway:
    enabled: true
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
logging:
  level:
    # Spring Framework
    org.springframework.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: INFO

