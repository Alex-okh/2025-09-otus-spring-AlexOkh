<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Страница авторов</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

<div th:replace="~{fragments :: page-header('Управление авторами', 'Полный список авторов')}"></div>

<div class="container">
    <table class="authors">
        <thead>
        <tr>
            <th>Автор</th>
        </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</div>
<div th:replace="~{fragments :: footer}"></div>
<script>
    $(function () {
        $.get('/api/authors').done(function (authors) {
            authors.forEach(function (author) {
                $('tbody').append(`
                    <tr>
                        <td>${author.fullName}</td>
                    </tr>
                `)
            })
        })
    })
</script>
</body>
</html>
