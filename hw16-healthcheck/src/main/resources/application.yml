spring:
  mvc:
    log-request-details: true
    hiddenmethod:
      filter:
        enabled: true
  datasource:
    url: jdbc:h2:mem:maindb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  flyway:
    enabled: true
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  application:
    name: HW16-healthcheck
logging:
  level:
    # Spring Framework
    org.springframework.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
  file:
    name: hw16.log
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,logfile,info
  endpoint:
    health:
      show-details: always
    logfile:
      access: read_only


