<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Страница авторов</title>
    <link href="/style.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments :: page-header('Управление авторами', 'Полный список авторов')}"></div>

<div class="container">
    <table class="authors">
        <thead>
        <tr>
            <th>Автор</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments :: footer}"></div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Используем fetch для получения данных из реактивного контроллера
        fetch('/api/flux/authors')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка при загрузке авторов');
                }
                return response.json();
            })
            .then(authors => {
                const tbody = document.querySelector('tbody');
                authors.forEach(author => {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');
                    cell.textContent = author.fullName;
                    row.appendChild(cell);
                    tbody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Ошибка:', error);
            });
    });
</script>
</body>
</html>
