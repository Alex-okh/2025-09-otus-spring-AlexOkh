<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Информация о книге</title>
    <link href="/style.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments :: page-header('Подробная информация о книге', '')}"></div>

<div class="container">
    <table>
        <thead>
        <tr>
            <th>Название</th>
            <th>Автор</th>
            <th>Жанры</th>
        </tr>
        </thead>
        <tbody id="book-info">
        </tbody>
    </table>
    <table>
        <thead>
        <tr>
            <th>Комментарии:</th>
        </tr>
        </thead>
        <tbody id="comments-list">
        </tbody>
    </table>

    <!-- Форма для добавления комментария -->
    <div class="add-comment-section">
        <h3>Добавить комментарий</h3>
        <form id="comment-form">
            <div class="form-group">
                <textarea cols="50" id="comment-text" placeholder="Введите ваш комментарий" required
                          rows="4"></textarea>
            </div>
            <button class="btn" type="submit">Добавить</button>
        </form>
    </div>

    <a href="#" id="edit-link">Редактировать</a>
    <a href="/books" style="margin-left: 20px;">Вернуться к списку книг</a>
</div>
<div th:replace="~{fragments :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', async function () {
        const pathSegments = window.location.pathname.split('/');
        const bookId = pathSegments[pathSegments.length - 1];

        // Функция для загрузки комментариев
        async function loadComments() {
            const commentsList = document.getElementById('comments-list');
            commentsList.innerHTML = '';

            try {
                const response = await fetch(`/api/flux/books/${bookId}/comments`);
                if (!response.ok) throw new Error('Ошибка при загрузке комментариев');

                const comments = await response.json();

                if (Array.isArray(comments) && comments.length > 0) {
                    comments.forEach(comment => {
                        const row = document.createElement('tr');
                        const cell = document.createElement('td');
                        cell.textContent = comment.text || '';
                        row.appendChild(cell);
                        commentsList.appendChild(row);
                    });
                } else {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');
                    cell.textContent = 'Комментариев пока нет';
                    row.appendChild(cell);
                    commentsList.appendChild(row);
                }
            } catch (error) {
                console.error("Ошибка при загрузке комментариев:", error);
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.textContent = 'Не удалось загрузить комментарии';
                row.appendChild(cell);
                commentsList.appendChild(row);
            }
        }

        // Загрузка информации о книге
        try {
            const response = await fetch(`/api/flux/books/${bookId}`);
            if (!response.ok) throw new Error('Ошибка при загрузке книги');

            const book = await response.json();
            const bookInfo = document.getElementById('book-info');

            const row = document.createElement('tr');

            const titleCell = document.createElement('td');
            titleCell.textContent = book.title;
            row.appendChild(titleCell);

            const authorCell = document.createElement('td');
            authorCell.textContent = book.author ? book.author.fullName : '';
            row.appendChild(authorCell);

            const genresCell = document.createElement('td');
            genresCell.textContent = book.genres ?
                book.genres.map(g => g.name).join(', ') : '';
            row.appendChild(genresCell);

            bookInfo.appendChild(row);

            // Устанавливаем ссылку для редактирования
            document.getElementById('edit-link').href = `/books/${bookId}/edit`;
        } catch (error) {
            console.error("Ошибка при загрузке книги:", error);
        }

        // Загрузка комментариев при открытии страницы
        await loadComments();

        // Обработчик формы добавления комментария
        document.getElementById('comment-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const commentText = document.getElementById('comment-text').value.trim();

            if (!commentText) {
                alert('Пожалуйста, введите текст комментария');
                return;
            }

            try {
                const response = await fetch(`/api/flux/books/${bookId}/comments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({text: commentText})
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText);
                }

                // Очищаем поле ввода
                document.getElementById('comment-text').value = '';

                // Перезагружаем список комментариев
                await loadComments();

                // Показываем сообщение об успехе
                alert('Комментарий успешно добавлен!');
            } catch (error) {
                console.error("Ошибка при добавлении комментария:", error);
                alert('Ошибка при добавлении комментария: ' + error.message);
            }
        });
    });
</script>

<style>
    .add-comment-section {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
    }

    .add-comment-section h3 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #333;
    }

    .form-group {
        margin-bottom: 15px;
    }

    textarea {
        width: 100%;
        max-width: 500px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: inherit;
        font-size: 14px;
    }

    .btn {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }

    .btn:hover {
        background-color: #45a049;
    }

    #edit-link {
        display: inline-block;
        margin-top: 20px;
        color: #2196F3;
        text-decoration: none;
    }

    #edit-link:hover {
        text-decoration: underline;
    }
</style>
</body>
</html>
